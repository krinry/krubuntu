<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d99f3" />
      <stop offset="100%" stop-color="#0a4b78" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3daee9" />
      <stop offset="100%" stop-color="#2ecc71" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="128" cy="128" r="116" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Outer Ring Accent -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- Plasma / Orbit Node 1 -->
  <circle cx="48" cy="128" r="12" fill="#3daee9" />
  <!-- Orbit Node 2 -->
  <circle cx="168" cy="58" r="12" fill="#2ecc71" />
  <!-- Orbit Node 3 -->
  <circle cx="168" cy="198" r="12" fill="#fdbc4b" />

  <!-- Stylized Modern 'K' Lettermark -->
  <g fill="#ffffff">
    <!-- Vertical stem -->
    <rect x="86" y="68" width="22" height="120" rx="10" />
    <!-- Upper Diagonal arm -->
    <path d="M 108 128 L 160 76 C 164 72 170 72 174 76 L 176 78 C 180 82 180 88 176 92 L 126 142 Z" />
    <!-- Lower Diagonal arm -->
    <path d="M 112 120 L 168 178 C 172 182 172 188 168 192 L 166 194 C 162 198 156 198 152 194 L 102 136 Z" />
  </g>
</svg>
