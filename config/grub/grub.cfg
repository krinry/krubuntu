set default="0"
set timeout=5

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Try or Install Krubuntu 26.04 LTS (KDE Plasma Live)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper live-media-path=/casper fsck.mode=skip ---
    initrd /casper/initrd
}

menuentry "Krubuntu (Safe Graphics - nomodeset)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper live-media-path=/casper nomodeset fsck.mode=skip ---
    initrd /casper/initrd
}

menuentry "Check Live Medium for Defects" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper integrity-check ---
    initrd /casper/initrd
}

submenu "Advanced & Power Options..." {
    menuentry "Reboot System" {
        reboot
    }
    menuentry "Power Off System" {
        halt
    }
}
