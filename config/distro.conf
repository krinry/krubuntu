# Krubuntu Distribution Configuration
# Professional Distro Build Settings

DISTRO_NAME="Krubuntu"
DISTRO_VERSION="26.04.1 LTS"
DISTRO_CODENAME="resolute"
DISTRO_EDITION="KDE Plasma Edition"
DISTRO_ARCH="amd64"

# Identity & URLs
DISTRO_URL="https://github.com/krinry/krubuntu"
DISTRO_BUG_URL="https://github.com/krinry/krubuntu/issues"
DISTRO_SUPPORT_URL="https://github.com/krinry/krubuntu"

# Live Environment Configuration
LIVE_USER="krubuntu"
LIVE_PASSWORD="123"
LIVE_HOSTNAME="krubuntu"

# Base Ubuntu RootFS Source
BASE_TARBALL="ubuntu-base-26.04.1-base-amd64.tar.gz"
BASE_URL="https://cdimage.ubuntu.com/ubuntu-base/releases/26.04/release/${BASE_TARBALL}"

# Compression Settings (zstd provides blazing-fast builds and 5x faster boot decompression)
SQUASHFS_COMP="zstd"
SQUASHFS_COMP_LEVEL="-Xcompression-level 15"

# Output ISO Name
ISO_OUTPUT_NAME="Krubuntu-26.04.1-amd64.iso"
