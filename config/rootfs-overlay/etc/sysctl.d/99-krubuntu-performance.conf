# Krubuntu System Performance & Responsiveness Tuning
# Inspired by Linux Mint, Fedora, and Pop!_OS engineering standards

# 1. Memory Management & Swap Responsiveness (Optimized for ZRAM)
vm.swappiness = 150
vm.vfs_cache_pressure = 50

# 2. Prevent Desktop Freezes During Heavy Disk/USB Writes
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# 3. Network TCP BBR Congestion Control & Low-Latency Queueing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 4. File Monitoring & System Limits
fs.inotify.max_user_watches = 524288
fs.file-max = 2097152

# 5. Laptop Power Saving (Disable NMI watchdog timer interrupt)
kernel.nmi_watchdog = 0
